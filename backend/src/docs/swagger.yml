openapi: 3.0.0
info:
  title: Ride Round Up API
  version: 1.0.0
  description: API Documentation for Ride Round Up backend
servers:
  - url: /api/v1
    description: v1 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Feature:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string
        category:
          type: string
          enum: [safety, exterior, interior, comfort, infotainment, convenience, performance, other]
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VariantFeature:
      type: object
      properties:
        _id:
          type: string
        variantId:
          type: string
        featureId:
          type: string
        availability:
          type: string
          enum: [standard, optional, unavailable]
        value:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Specification:
      type: object
      properties:
        _id:
          type: string
        variantId:
          type: string
        performance:
          type: object
          properties:
            topSpeedKph:
              type: number
            acceleration0To100Kph:
              type: number
        dimensions:
          type: object
          properties:
            lengthMm:
              type: number
            widthMm:
              type: number
            heightMm:
              type: number
            wheelbaseMm:
              type: number
            groundClearanceMm:
              type: number
        capacity:
          type: object
          properties:
            bootSpaceLitres:
              type: number
            fuelTankLitres:
              type: number
        weight:
          type: object
          properties:
            kerbWeightKg:
              type: number
            grossWeightKg:
              type: number
        fuel:
          type: object
          properties:
            fuelEconomyCity:
              type: number
            fuelEconomyHighway:
              type: number
            fuelEconomyCombined:
              type: number
            economyUnit:
              type: string
        safety:
          type: object
          properties:
            airbags:
              type: number
            abs:
              type: boolean
            tractionControl:
              type: boolean
            stabilityControl:
              type: boolean
            parkingSensors:
              type: string
            camera:
              type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error message
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request successful
    Brand:
      type: object
      properties:
        _id:
          type: string
        brandCode:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, inactive]
    Model:
      type: object
      properties:
        _id:
          type: string
        brandId:
          type: string
        modelCode:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]
    Generation:
      type: object
      properties:
        _id:
          type: string
        modelId:
          type: string
        generationCode:
          type: string
        name:
          type: string
        slug:
          type: string
        startYear:
          type: integer
        endYear:
          type: integer
        status:
          type: string
          enum: [active, inactive, draft]
    Variant:
      type: object
      properties:
        _id:
          type: string
        generationId:
          type: string
        variantCode:
          type: string
        name:
          type: string
        slug:
          type: string
        modelYear:
          type: integer
        fuelType:
          type: string
        transmissionType:
          type: string
        drivetrain:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]
    Market:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
        currencyCode:
          type: string
        currencySymbol:
          type: string
        status:
          type: string
          enum: [active, inactive, draft]

paths:
  /api/v1/features:
    get:
      tags:
        - Features
      summary: Get all features
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of features
    post:
      tags:
        - Features
      summary: Create a feature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                  enum: [safety, exterior, interior, comfort, infotainment, convenience, performance, other]
                description:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '201':
          description: Feature created

  /api/v1/features/{id}:
    get:
      tags:
        - Features
      summary: Get feature by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature details
    patch:
      tags:
        - Features
      summary: Update feature
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Feature updated
    delete:
      tags:
        - Features
      summary: Delete (deactivate) feature
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature deleted

  /api/v1/features/slug/{slug}:
    get:
      tags:
        - Features
      summary: Get feature by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Feature details

  /api/v1/variant-features:
    get:
      tags:
        - Variant Features
      summary: Get all variant features
      parameters:
        - in: query
          name: variantId
          schema:
            type: string
        - in: query
          name: featureId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of variant features
    post:
      tags:
        - Variant Features
      summary: Map a feature to a variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variantId:
                  type: string
                featureId:
                  type: string
                availability:
                  type: string
                  enum: [standard, optional, unavailable]
                value:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '201':
          description: Variant feature mapped

  /api/v1/variant-features/{id}:
    get:
      tags:
        - Variant Features
      summary: Get variant feature mapping by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variant feature mapping details
    patch:
      tags:
        - Variant Features
      summary: Update variant feature mapping
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability:
                  type: string
                  enum: [standard, optional, unavailable]
                value:
                  type: string
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Variant feature mapping updated
    delete:
      tags:
        - Variant Features
      summary: Delete (deactivate) variant feature mapping
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variant feature mapping deleted

  /api/v1/variants/{variantId}/features:
    get:
      tags:
        - Variant Features
      summary: Get all features mapped to a specific variant
      parameters:
        - in: path
          name: variantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of features mapped to variant

